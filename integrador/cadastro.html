<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-container">
        <div class="hero-text">
            Junte-se a nós hoje mesmo!
        </div>
        
        <div class="login-box">
            <h2>Criar Conta</h2>
            
            <form action="index.html" method="GET" style="width: 100%;">
                <input type="text" class="input-field" placeholder="Nome Completo" required>
                <input type="email" class="input-field" placeholder="E-mail" required>
                <input type="password" class="input-field" placeholder="Senha" required>
                
                <div style="text-align: center;">
                    <button type="submit" class="btn-entrar">Cadastrar</button>
                </div>
            </form>
            
            <div class="links">
                Já tem uma conta? <a href="index.html">Faça login</a>
            </div>
        </div>
    </div>
</body>
</html>

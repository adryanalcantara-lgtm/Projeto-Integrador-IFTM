<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-container">
        <div class="hero-text">
            Faça Login e Aproveite nossos Serviços!
        </div>
        
        <div class="login-box">
            <h2>Fazer login com:</h2>
            
            <button class="social-btn">
                Fazer Login com Google
            </button>
            <button class="social-btn">
                Fazer Login com Apple
            </button>
            
            <form action="intranet_cliente.html" method="GET" style="width: 100%;">
                <input type="email" class="input-field" placeholder="E-mail" required>
                <input type="password" class="input-field" placeholder="Senha" required>
                
                <div style="text-align: center;">
                    <button type="submit" class="btn-entrar">Entrar</button>
                </div>
            </form>
            
            <div class="links">
                Não tem uma conta? <a href="cadastro.html">Registre-se</a><br><br>
                Esqueceu a senha? <a href="recuperar-senha.html">Recuperar</a>
            </div>
        </div>
    </div>
</body>
</html>

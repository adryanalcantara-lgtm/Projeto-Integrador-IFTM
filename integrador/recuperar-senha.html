<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-container">
        <div class="login-box">
            <h2>Recuperar Senha</h2>
            
            <form action="index.html" method="GET" style="width: 100%;">
                <input type="email" class="input-field" placeholder="Digite seu E-mail" required>
                
                <div style="text-align: center;">
                    <button type="submit" class="btn-entrar">Enviar Link</button>
                </div>
            </form>
            
            <div class="links">
                Lembrou a senha? <a href="index.html">Voltar ao login</a>
            </div>
        </div>
    </div>
</body>
</html>

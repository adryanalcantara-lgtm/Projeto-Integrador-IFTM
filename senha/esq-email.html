<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CinePoca - Esqueceu a senha</title>
<link rel="stylesheet" href="senha.css">
</head>
<body>

  <div class="fundo-recuperar">
    <div class="caixa-recuperar">

      <h2>Esqueceu a senha?</h2>
      <p class="subtitulo">Sem problema. Digite seu e-mail e enviaremos um código de verificação.</p>

      <form>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
        </div>

        <a href="código.html" class="botao-continuar">Enviar código</a>
      </form>

      <p class="voltar-login">Lembrou a senha? <a href="/login/login.html">Voltar para o login</a></p>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CinePoca - Nova senha</title>
<link rel="stylesheet" href="senha.css">
</head>
<body>

  <div class="fundo-recuperar">
    <div class="caixa-recuperar">

      <h2>Criar nova senha</h2>
      <p class="subtitulo">Escolha uma nova senha para acessar sua conta.</p>

      <form>
        <div class="campo">
          <label for="nova-senha">Nova senha</label>
          <input type="password" id="nova-senha" name="nova-senha" placeholder="Digite a nova senha" required>
        </div>

        <div class="campo">
          <label for="confirmar-senha">Confirme a nova senha</label>
          <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite a senha novamente" required>
        </div>

        <a href="/login/login.html" class="botao-continuar">Redefinir senha</a>
      </form>

      <p class="voltar-login"><a href="/login/login.html">Voltar para o login</a></p>
    </div>
  </div>

</body>
</html>

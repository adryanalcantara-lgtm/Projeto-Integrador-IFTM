<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CinePoca - Verificar código</title>
<link rel="stylesheet" href="senha.css">
</head>
<body>

  <div class="fundo-recuperar">
    <div class="caixa-recuperar">

      <h2>Digite o código</h2>
      <p class="subtitulo">Enviamos um código de 6 dígitos para o seu e-mail. Digite ele abaixo.</p>

      <form>
        <div class="campo">
          <label for="codigo">Código de verificação</label>
          <input type="text" id="codigo" name="codigo" placeholder="000000" maxlength="6" required>
        </div>

        <a href="novasenha.html" class="botao-continuar">Verificar código</a>
      </form>

      <p class="reenviar-codigo">Não recebeu? <a href="">Reenviar código</a></p>

      <p class="voltar-login"><a href="/login/login.html">Voltar para o login</a></p>
    </div>
  </div>

</body>
</html>

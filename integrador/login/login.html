<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CinePoca - Login</title>
<link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="container">

    <div class="lado-esquerdo">
      <div class="logo">CINE<span>POCA</span></div>
      <h1 class="titulo">Faça login e aproveite nossos serviços!</h1>
      <p class="texto">Receba recomendações de filmes de acordo com o seu gosto.</p>
    </div>

    <div class="lado-direito">
      <div class="caixa-login">
        <h2>Fazer login com:</h2>
        <p class="subtitulo">Entre com sua conta para continuar</p>

        <button class="botao-google" type="button">
          <img src="https://www.google.com/favicon.ico" alt="Google">
          Fazer Login com Google
        </button>

        <button class="botao-apple" type="button">
          <img src="https://www.apple.com/favicon.ico" alt="Apple">
          Fazer Login com Apple
        </button>

        <p class="linha-divisoria">ou</p>

        <form>
  <div class="campo">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
  </div>

  <div class="campo">
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
  </div>

  <div class="esqueceu-senha">
    <a href="#">Esqueceu a senha?</a>
  </div>

  <a href="/home/home.html" class="botao-entrar">Entrar</a>
</form>

        <p class="texto-cadastro">Não tem uma conta? <a href="/registro/registro.html">Registre-se</a></p>
      </div>
    </div>

  </div>

</body>
</html>

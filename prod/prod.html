<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CinePoca - Painel do Produtor</title>
<link rel="stylesheet" href="/home/home.css">
</head>
<body>

  <!-- encima -->
  <header class="menu">
    <div class="logo">
      <div class="logo">
        <img class="imglogo" src="/assets/cinepoca1.png" alt="cinepocalogo">
      </div>
      <span class="selo-perfil produtor">Produtor</span>
    </div>

    <nav class="menu-links">
      <a href="#topo" class="botao-menu">Home</a>
      <a class="botao-menu">Pesquisar</a>
      <a href="/login/login.html" class="botao-menu-login">Sair</a>
    </nav>
  </header>

  <!-- titulo -->
  <section id="topo" class="boas-vindas">
    <h1>Painel do Produtor</h1>
  </section>

  <!-- meus filme -->
  <section class="painel-produtor">
    <div class="cabecalho-produtor">
      <h2>Meus Filmes</h2>
      <a href="" class="botao-cadastrar-filme">+ Cadastrar Novo Filme</a>
    </div>

    <div class="lista-filmes">

      <div class="card-filme card-filme-produtor">
        <div class="capa-filme capa-filme-1"></div>
        <p class="nome-filme">Odisseia</p>
        <p class="nota-filme">⭐ 8,4</p>
        <a href="" class="botao-editar-filme">Editar</a>
      </div>

      <div class="card-filme card-filme-produtor">
        <div class="capa-filme capa-filme-2"></div>
        <p class="nome-filme">Oppenheimer</p>
        <p class="nota-filme">⭐ 8,2</p>
        <a href="" class="botao-editar-filme">Editar</a>
      </div>

      <div class="card-filme card-filme-produtor">
        <div class="capa-filme capa-filme-3"></div>
        <p class="nome-filme">Interestelar</p>
        <p class="nota-filme">⭐ 8,7</p>
        <a href="" class="botao-editar-filme">Editar</a>
      </div>

    </div>
  </section>

  <!-- catalogo do js do home normal -->
  <div id="categorias"></div>

  <script src="script.js"></script>

</body>
</html>
